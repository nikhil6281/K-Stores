<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <title>Offline — RA Store Anantapur</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <style>
    :root {
      --primary: #15803d;
      --primary-dark: #166534;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      background: #dcfce7;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px auto;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .store-info {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .store-info strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">📶</div>
    <h1>You are currently offline</h1>
    <p>RA Store needs an active internet connection to load fresh grocery stock, real-time prices, and process your delivery orders.</p>
    <button class="btn btn-primary" onclick="window.location.reload()">🔄 Retry Connection</button>
    <a href="tel:6281730144" class="btn btn-outline">📞 Call Store (+91 6281730144)</a>
    <div class="store-info">
      <p><strong>RA Store (Sri Sai General Store)</strong><br>Old Town, Anantapur — 515001<br>Daily Operating Hours: 7:00 AM – 9:00 PM IST</p>
    </div>
  </div>
</body>
</html>
