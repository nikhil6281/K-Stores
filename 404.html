<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sri Sai (శ్రీ సాయి జనరల్ ఆన్లైన్ స్టోర్)</title>
    <script type="text/javascript">
      // GitHub Pages Route Handler & SPA Redirect
      var l = window.location;
      var path = l.pathname.toLowerCase();
      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      
      // Determine repo prefix (e.g. /K-Stores or empty if custom domain)
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var repoPrefix = pathSegments.length > 0 && pathSegments[0].toLowerCase() === 'k-stores' ? '/K-Stores' : '';
      
      if (path.endsWith('/admin') || path.endsWith('/admin/')) {
        l.replace(origin + repoPrefix + '/admin.html' + l.search + l.hash);
      } else if (path.endsWith('/staff') || path.endsWith('/staff/') || path.endsWith('/worker') || path.endsWith('/worker/')) {
        l.replace(origin + repoPrefix + '/worker.html' + l.search + l.hash);
      } else {
        var pathSegmentsToKeep = repoPrefix ? 1 : 0;
        l.replace(
          origin +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
